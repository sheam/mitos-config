[[snippet]]
name = "go: single constant"
prefix = ["co"]
scope = "go"
description = "Snippet for a constant"
body = ["const ${1:name} = ${2:value}"]

[[snippet]]
name = "go: multiple constants"
prefix = ["cos"]
scope = "go"
description = "Snippet for a constant block"
body = ["const (", "\t${1:name} = ${2:value}", ")"]

[[snippet]]
name = "go: type function declaration"
prefix = ["tyf"]
scope = "go"
description = "Snippet for a type function declaration"
body = ["type ${1:name} func($3) $4"]

[[snippet]]
name = "go: type interface declaration"
prefix = ["tyi"]
scope = "go"
description = "Snippet for a type interface"
body = ["type ${1:name} interface {", "\t$0", "}"]

[[snippet]]
name = "go: type struct declaration"
prefix = ["tys"]
scope = "go"
description = "Snippet for a struct declaration"
body = ["type ${1:name} struct {", "\t$0", "}"]

[[snippet]]
name = "go: function declaration"
prefix = ["func"]
scope = "go"
description = "Snippet for function declaration"
body = ["func $1($2) $3 {", "\t$0", "}"]

[[snippet]]
name = "go: variable declaration"
prefix = ["var"]
scope = "go"
description = "Snippet for a variable"
body = ["var ${1:name} ${2:type}"]

[[snippet]]
name = "go: variables declaration"
prefix = ["vars"]
scope = "go"
description = "Snippet for a variable"
body = ["var (", "\t${1:name} ${2:type} = ${3:value}", ")"]

[[snippet]]
name = "go: switch statement"
prefix = ["switch"]
scope = "go"
description = "Snippet for switch statement"
body = ["switch ${1:expression} {", "case ${2:condition}:", "\t$0", "}"]

[[snippet]]
name = "go: select statement"
prefix = ["sel"]
scope = "go"
description = "Snippet for select statement"
body = ["select {", "case ${1:condition}:", "\t$0", "}"]

[[snippet]]
name = "go: case clause"
