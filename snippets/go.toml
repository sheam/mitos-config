[[snippet]]
name = "go: hello world web app"
prefix = ["helloweb"]
scope = "go"
description = "Snippet for sample hello world webapp"
body = ["package main", "", "import (", "\t\"fmt\"", "\t\"net/http\"", "\t\"time\"", ")", "", "func greet(w http.ResponseWriter, r *http.Request) {", "\tfmt.Fprintf(w, \"Hello World! %s\", time.Now())", "}", "", "func main() {", "\thttp.HandleFunc(\"/\", greet)", "\thttp.ListenAndServe(\":8080\", nil)", "}"]

[[snippet]]
name = "go: sort implementation"
prefix = ["sort"]
scope = "go"
description = "Snippet for a custom sort.Sort interface implementation, for a given slice type."
body = ["type ${1:SortBy} []${2:Type}", "", "func (a $1) Len() int           { return len(a) }", "func (a $1) Swap(i, j int)      { a[i], a[j] = a[j], a[i] }", "func (a $1) Less(i, j int) bool { ${3:return a[i] < a[j]} }"]

