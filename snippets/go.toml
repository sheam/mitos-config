[[snippet]]
name = "go: http handler declaration"
prefix = ["hand"]
scope = "go"
description = "Snippet for http handler declaration"
body = ["func $1(${2:w} http.ResponseWriter, ${3:r} *http.Request) {", "\t$0", "}"]

[[snippet]]
name = "go: http.Redirect"
prefix = ["rd"]
scope = "go"
