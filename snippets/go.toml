[[snippet]]
name = "go: test function"
prefix = ["tf"]
scope = "go"
description = "Snippet for Test function"
body = ["func Test$1(t *testing.T) {", "\t$0", "}"]

[[snippet]]
name = "go: test main"
prefix = ["tm"]
scope = "go"
description = "Snippet for TestMain function"
body = ["func TestMain(m *testing.M) {", "\t$1", "", "\tos.Exit(m.Run())", "}"]

[[snippet]]
name = "go: benchmark function"
prefix = ["bf"]
scope = "go"
description = "Snippet for Benchmark function"
body = ["func Benchmark$1(b *testing.B) {", "\tfor ${2:i} := 0; ${2:i} < b.N; ${2:i}++ {", "\t\t$0", "\t}", "}"]

[[snippet]]
name = "go: example function"
prefix = ["ef"]
scope = "go"
description = "Snippet for Example function"
body = ["func Example$1() {", "\t$2", "\t//Output:", "\t$3", "}"]

[[snippet]]
name = "go: table driven test"
prefix = ["tdt"]
scope = "go"
description = "Snippet for table driven test"
body = ["func Test$1(t *testing.T) {", "\ttestCases := []struct {", "\t\tdesc\tstring", "\t\t$2", "\t}{", "\t\t{", "\t\t\tdesc: \"$3\",", "\t\t\t$4", "\t\t},", "\t}", "\tfor _, tC := range testCases {", "\t\tt.Run(tC.desc, func(t *testing.T) {", "\t\t\t$0", "\t\t})", "\t}", "}"]

