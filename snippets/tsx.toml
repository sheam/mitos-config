[[snippet]]
name = "tsx: destructuring of props"
prefix = ["dp"]
scope = "tsx"
body = ["const { ${1:name} } = this.props"]

[[snippet]]
name = "tsx: reactFunctionComponent"
prefix = ["rfc"]
scope = "tsx"
description = "Creates a React functional component"
body = ["interface I${1:Component}Props {", "\t${2:name}: ${3:string};", "\t${4:var2}: ${5:string};", "}", "export const $1 = ({$2, $4}: I${1}Props): ReactElement => {", "\treturn (", "\t\t$0", "\t);", "}"]

